<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120018" />
  <meta name="description" content="OMNI — a 3D hyperpop goddess who can do anything. Create life, change reality, destroy it all." />
  <title>OMNI — She Can Do Anything</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23ff5fd2'/%3E%3Cstop offset='1' stop-color='%237df9ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23120018'/%3E%3Cpath d='M32 9c1.6 10.5 6.4 15.3 16.9 16.9C38.4 27.5 33.6 32.3 32 42.8 30.4 32.3 25.6 27.5 15.1 25.9 25.6 24.3 30.4 19.5 32 9Z' fill='url(%23g)'/%3E%3C/svg%3E" />
  <link rel="preload" href="./assets/fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="./assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body data-mode="create">
  <main id="app">
    <canvas id="scene" aria-label="A three dimensional hyperpop goddess floating above a neon grid. Cast divine powers on the world."></canvas>

    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <div id="flash" class="flash" aria-hidden="true"></div>
    <div id="prism" class="prism" aria-hidden="true"></div>

    <header class="hud top">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.6c.7 4.6 2.8 6.7 7.4 7.4-4.6.7-6.7 2.8-7.4 7.4-.7-4.6-2.8-6.7-7.4-7.4 4.6-.7 6.7-2.8 7.4-7.4Z"/>
            <path d="M18.7 16.2c.3 1.9 1.2 2.8 3.1 3.1-1.9.3-2.8 1.2-3.1 3.1-.3-1.9-1.2-2.8-3.1-3.1 1.9-.3 2.8-1.2 3.1-3.1Z"/>
          </svg>
        </span>
        <div class="brand-type">
          <h1>OMNI</h1>
          <p>SHE CAN DO ANYTHING</p>
        </div>
      </div>

      <div class="top-actions">
        <div class="stat" id="life-stat">
          <span>LIVES</span>
          <strong id="lives">06</strong>
        </div>
        <button id="sound" class="icon-btn" type="button" aria-label="Turn sound on" aria-pressed="false" title="Sound">
          <svg class="ico-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/>
          </svg>
          <svg class="ico-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/>
          </svg>
        </button>
        <button id="reset" class="icon-btn" type="button" aria-label="Reset the world" title="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3"/><path d="M3.5 4.5V10H9"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="side-meta" aria-hidden="true">
      <span id="act-index">ACT I</span>
      <strong id="act-name">GENESIS</strong>
      <i></i>
      <span>DIVINITY</span>
      <strong>∞</strong>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite">
      <span id="toast-kicker" class="toast-kicker">DIVINE ACT</span>
      <strong id="toast-title">CREATE</strong>
      <small id="toast-sub">life blooms at your touch</small>
    </div>

    <footer class="hud bottom">
      <p class="hint" id="hint"><span class="hint-desktop">CLICK ANYWHERE TO CAST</span><span class="hint-mobile">TAP THE WORLD TO CAST</span> <b>·</b> <span class="hint-keys">1&nbsp;2&nbsp;3&nbsp;TO SWITCH</span></p>
      <div class="dock" role="group" aria-label="Divine powers">
        <button class="power is-active" type="button" data-mode="create" aria-pressed="true">
          <span class="key" aria-hidden="true">1</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2.5c.7 4.8 2.9 7 7.7 7.7-4.8.7-7 2.9-7.7 7.7-.7-4.8-2.9-7-7.7-7.7 4.8-.7 7-2.9 7.7-7.7Z"/>
            <path d="M19 16.5c.3 1.9 1.2 2.8 3.1 3.1-1.9.3-2.8 1.2-3.1 3.1-.3-1.9-1.2-2.8-3.1-3.1 1.9-.3 2.8-1.2 3.1-3.1Z"/>
          </svg>
          <span class="label">CREATE</span>
        </button>
        <button class="power" type="button" data-mode="change" aria-pressed="false">
          <span class="key" aria-hidden="true">2</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 3.5V9H15"/><path d="M8.6 12.2c1.1-1.6 2.4-2.4 3.4-2.4 1 0 2.3.8 3.4 2.4-1.1 1.6-2.4 2.4-3.4 2.4-1 0-2.3-.8-3.4-2.4Z"/>
          </svg>
          <span class="label">CHANGE</span>
        </button>
        <button class="power" type="button" data-mode="destroy" aria-pressed="false">
          <span class="key" aria-hidden="true">3</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13.3 2.5 5 13.4h5.1L9.4 21.5l8.6-11.2h-5.2l.5-7.8Z"/>
            <path d="M18.8 3.2 21 5.4M20.8 8.6l2.2.4M2.8 4.2l1.8 1.4"/>
          </svg>
          <span class="label">DESTROY</span>
        </button>
      </div>
      <p class="footnote" aria-hidden="true"><span>OMNI.SYS</span><span>POWER&nbsp;∞</span><span>V.01</span></p>
    </footer>

    <div id="fallback" class="fallback" hidden>
      <h2>THE VEIL WILL NOT OPEN</h2>
      <p>This experience needs WebGL. Try a modern browser with hardware acceleration enabled.</p>
    </div>
  </main>
  <noscript><p class="noscript">OMNI needs JavaScript to summon the world.</p></noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
